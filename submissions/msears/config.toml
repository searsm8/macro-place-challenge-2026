# MSPlacer configuration
# Loaded automatically from the same directory as placer.py.
# Any key omitted here falls back to the hardcoded default in placer.py.

[params]
# ── Gradient descent ──────────────────────────────────────────────────────
max_iters     = 2000  # upper bound; early stopping will usually fire before this
seed          = 42

# Smoothness of the WA HPWL approximation.
# "auto" -> canvas_diag / 8.0 at runtime. Set a float to override.
gamma         = "auto"
gamma_decay   = 0.98    # multiply gamma by this each iteration
gamma_min_frac = 0.00667 # gamma_min = canvas_diag * gamma_min_frac

# Maximum distance any macro can move in one iteration.
# "auto" -> canvas_diag * 0.005. Set a float to override.
max_step      = "auto"

# ── Convergence ───────────────────────────────────────────────────────────
stop_overflow      = 0.1    # Lgamma: stop when overflow_ratio < this AND wl rising
plateau_window     = 10     # Lsub: moving-average window for loss plateau detection
plateau_threshold  = 0.001  # Lsub: stop when improvement < this fraction per window
divergence_window  = 50     # stop if overflow rising AND wl > 2× best wl (last N iters)

# ── Method selection ──────────────────────────────────────────────────────
density_method        = "electrostatic"   # "bell" or "electrostatic"
hpwl_gradient_method  = "wa"              # "wa" (weighted-average) — more to come
legalization          = "spiral"          # "none" or "spiral"
use_preconditioner    = true              # divide gradient by (macro_area + net_degree) per macro

# ── Lambda (density weight) schedule ──────────────────────────────────────
lambda_schedule         = "hpwl"  # "hpwl" (feedback) or "geometric" (old fixed ramp)

# hpwl mode — DREAMplace RePlAce-style feedback
# λ_init = density_weight × ‖wl_grad‖₁ / ‖den_grad‖₁  (auto-scaled per benchmark)
# λ *= mu each iter, where mu ∈ [pcof_lower, pcof_upper] based on ΔHPWL
density_weight          = 8e-5   # scale factor for auto-init
lambda_pcof_upper       = 1.05   # max per-step multiplier (WL decreasing)
lambda_pcof_lower       = 0.95   # min per-step multiplier (λ can decrease when WL rising fast)

# geometric mode — kept for ablation / backward compat
density_weight_init     = 1e-5   # fixed initial λ (geometric only)
density_weight_max_step = 1.04   # fixed ramp multiplier (geometric only)

# shared
warmup_iters            = 20     # WL-only iterations before density activates
density_weight_max      = 100.0  # hard safety cap on λ (both modes)
target_density          = 0.8    # target area utilization per grid cell

[output]
log_every     = 50      # print WL loss every N iterations (0 = silent loop)
record_frames = true    # export macro positions each iteration for animation
frames_dir    = "vis/frames"  # where to write per-iteration frame files
quiet         = false   # suppress all output except errors (for batch runs)
