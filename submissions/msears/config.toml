# CometPlacer configuration
# Loaded automatically from the same directory as placer.py.
# Any key omitted here falls back to the hardcoded default in placer.py.

[params]
# ── Phase 1: mIP — Macro Initial Placement ────────────────────────────────
# "none"      : use benchmark default positions
# "center"    : scatter randomly near canvas center (see initial_spread)
# "quadratic" : quadratic WL solve (B2B CLIQUE + refinement)
initial_placement        = "quadratic"
initial_spread           = 0.01   # fraction of canvas area for center-scatter radius
quad_b2b_iters           = 3      # B2B refinement passes after CLIQUE warm-start (0 = CLIQUE only)
quad_net_size_threshold  = 50     # nets larger than this use star model instead of CLIQUE

# ── Phase 2: mGP — Mixed Global Placement ─────────────────────────────────
use_gpu               = true           # use CUDA GPU if available; false forces CPU
density_method        = "electrostatic" # "bell" or "electrostatic"
use_preconditioner    = true           # divide gradient by (macro_area + net_degree)
optimizer             = "bb_sgd"       # "sgd", "bb_sgd", or "nesterov"
alpha_init            = "auto"         # initial step size for bb_sgd/nesterov
max_iters             = 8000           # upper bound; early stopping usually fires first
seed                  = 42
deterministic         = true           # force deterministic GPU ops; ~10-30% slower

# Smoothness of the WA HPWL approximation.
# "auto" -> canvas_diag / 8.0 at runtime. Set a float to override.
gamma         = "auto"
gamma_decay   = 0.98     # multiply gamma by this each iteration
gamma_min_frac = 0.00667 # gamma_min = canvas_diag * gamma_min_frac

# Maximum distance any macro can move in one iteration.
# "auto" -> canvas_diag * 0.005. Set a float to override.
max_step      = "auto"

# ── mGP convergence ───────────────────────────────────────────────────────
stop_overflow      = 0.05   # Lgamma: stop when overflow_ratio < this AND wl rising
plateau_window     = 10     # Lsub: moving-average window for loss plateau detection
plateau_threshold  = 0.001  # Lsub: stop when improvement < this fraction per window
divergence_window  = 50     # stop if overflow rising AND wl > 5× best wl (last N iters)

# ── mGP lambda (density weight) schedule ──────────────────────────────────
lambda_schedule         = "hpwl"  # "hpwl" (feedback) or "geometric" (fixed ramp)

# hpwl mode
density_weight          = 8e-2
lambda_pcof_upper       = 1.05   # multiplier when overflow is NOT improving (ramp hard)
lambda_pcof_lower       = 1.01   # multiplier when overflow IS actively decreasing (gentle ramp)

# geometric mode
density_weight_init     = 1e-5
density_weight_max_step = 1.05

# shared
warmup_iters            = 20
density_weight_max      = 5000
target_density          = 0.5

# ── mGP hard-macro density boost ──────────────────────────────────────────
# Extra multiplier on the density gradient for hard macros only.
# Starts at lambda_hm_init, decays by lambda_hm_decay each iter toward 1.0.
lambda_hm_init  = 1.0    # initial hard-macro density boost (1.0 = disabled)
lambda_hm_decay = 0.995  # per-iter decay

# ── mGP macro halos ───────────────────────────────────────────────────────
# Inflate hard macro footprints in the density map by this fraction, reserving
# whitespace so the legalizer makes smaller corrections.
# halo_size = 0.1 → macro occupies (1.1w)×(1.1h) in the density field.
# Charge is conserved via area_ratio scaling (see density.py). 0 = disabled.
halo_size     = 0.4
halo_legalize = 0.1

# ── Phase 2.5: Hard-macro spread ──────────────────────────────────────────
# After mGP convergence, remove soft macros from the density map and run a
# short continuation so hard macros spread into remaining whitespace.
# Only supported with density_method = "electrostatic".
hard_spread       = false  # enable phase 2.5
hard_spread_iters = 50     # number of SGD iterations

# ── Phase 3: mLG — Macro Legalization ─────────────────────────────────────
# "none"   : skip legalization (allow overlaps)
# "bump"   : pairwise bump (iterative push-apart)
# "spiral" : spiral push-out from canvas center
legalization = "bump"

# ── Phase 3.5: Rotation Optimizer ─────────────────────────────────────────
# "none"     : skip
# "greedy"   : exhaustive greedy flip after mLG
# "anneal"   : simulated annealing after mLG
# "periodic" : greedy flip every rotation_period mGP iterations
rotation_optimizer   = "greedy"  # "none", "greedy", "anneal", or "periodic"
rotation_passes      = 2         # greedy: full passes over all macros
rotation_period      = 20        # periodic: mGP iters between rotation calls
sa_T_init            = 1e-4      # SA initial temperature (WL units)
sa_T_final           = 1e-7      # SA final temperature
sa_steps_per_macro   = 200       # SA total steps = this × num_hard_macros
# Orientation candidates for the rotation optimizer:
#   "NS"      : N, S only (180° rotation — most conservative)
#   "no-swap" : N, FN, S, FS (all non-transposing; mirrors only)
#   "all"     : all 8 D4 orientations including E/W 90° rotations (default)
# E/W are safe: plc.update_macro_orientation only rotates pin offsets, not
# macro footprints, so legalization remains valid.
rotation_candidates  = "all"

# ── Phase 4: cGP — Cell Global Placement ──────────────────────────────────
# Lock hard macros at legalized positions; re-run WL + density gradient
# descent for soft macros only to fill whitespace left by mLG.
soft_place       = true   # enable phase 4
soft_place_iters = 1000   # max iterations (early stopping applies)

[output]
log_every     = 50
record_frames = true
frames_dir    = "vis/frames"
quiet         = false
# Specific macros to highlight by name in the GIF renderer.
# Takes priority over highlight_random_macros. Example:
#   highlight_macros = ["a12324", "a3044"]
highlight_macros = []
# Randomly highlight N macros weighted by area. Used only when highlight_macros is empty.
highlight_random_macros = 2

# ── Genetic Algorithm (orientation search) ────────────────────────────────
# Set enabled = true to activate. The GA runs before the full gradient descent,
# finding the best hard-macro orientation assignment via curtailed placements.
[ga]
ga_enable                  = false
ga_population_size         = 16
ga_n_generations           = 50
ga_elite_frac              = 0.25   # top fraction preserved unchanged each generation
ga_mutation_rate           = 0.05   # per-gene probability of random orientation flip
ga_tournament_k            = 3      # tournament selection pool size
ga_curtailed_iters         = 300    # max_iters for fast GA evaluation runs (no legalization)
ga_fitness_wl_weight       = 1.0    # WL contribution to fitness
ga_fitness_overflow_weight = 0.5    # overflow ratio contribution to fitness
ga_n_workers               = 1      # >1 enables multiprocessing (not yet implemented)
ga_seed                    = 0      # RNG seed for reproducible GA runs
