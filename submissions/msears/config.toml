# CometPlacer configuration
# Loaded automatically from the same directory as placer.py.
# Any key omitted here falls back to the hardcoded default in placer.py.

[params]
# ── Phase 1: mIP — Macro Initial Placement ────────────────────────────────
initial_placement        = "quadratic"   # "none", "center", or "quadratic"
center_init_spread       = 0.05    # fraction of canvas area for center-scatter radius (only used when initial_placement = "center")
quad_b2b_iters           = 6       # B2B refinement passes after CLIQUE warm-start (0 = CLIQUE only)
quad_net_size_threshold  = 50      # nets larger than this use star model instead of CLIQUE
quad_anchor_fraction     = 0       # (0 = disabled)fraction of movable macros (ranked by area×net_degree) fixed as internal anchors in stage 1
quad_scatter_n           = 0         # (0 = disabled) scatter+lock exactly N largest hard macros; overrides quad_scatter_fraction when non-zero
quad_scatter_fraction   = 0.1       # (0 = disabled) scatter+lock largest macros until their cumulative area >= this fraction of total movable area
quad_scatter_lock_mult   = 1e6      # (0 = disabled) keep scatter macros fixed in mGP until lambda >= this × lambda_0
quad_scatter_section_count    = 8   # divide die into N sections for largest scatter macro (1 = disabled)
quad_scatter_runs_per_section = 1   # placement runs per section; total runs = section_count × runs_per_section
largest_macro_starting_section = 1  # 0 = use multi-section sweep; 1..N = GA gene pins largest macro to this section

# ── Phase 2: mGP — Mixed Global Placement ─────────────────────────────────
mgp_enable            = true            # phase 2: run mixed global placement (set false to skip mGP entirely)
use_gpu               = true # use CUDA GPU if available; false forces CPU
density_method        = "electrostatic" # "bell" or "electrostatic"
density_grid_size     = 64             # override benchmark grid (null = use benchmark 45×41); try 64, 128, 256, 512
use_preconditioner    = true            # divide gradient by (macro_area + net_degree)
optimizer             = "bb_sgd"        # "sgd", "bb_sgd", or "nesterov"
alpha_init            = "auto"          # initial step size for bb_sgd/nesterov
max_iters             = 8000            # upper bound; early stopping usually fires first
seed                  = 2
deterministic         = true            # force deterministic GPU ops; ~10-30% slower

gamma          = "auto"  # WA HPWL smoothness: "auto" (decay from canvas_diag/8), "ovfw" (overflow-driven, XPlace), or <float>
gamma_decay    = 0.994   # multiply gamma by this each iteration
gamma_min_frac = 0.00667 # gamma_min = canvas_diag * gamma_min_frac
max_step       = 0.005   # max macro displacement per iter as fraction of canvas_diag; e.g. 0.005 → canvas_diag × 0.005

# ── mGP convergence ───────────────────────────────────────────────────────
stop_overflow      = 0.05   # Lgamma: stop when overflow_ratio < this AND wl rising
plateau_window     = 10     # Lsub: moving-average window for loss plateau detection
plateau_threshold  = 0.001  # Lsub: stop when improvement < this fraction per window
divergence_window  = 50     # stop if overflow rising AND wl > 5× best wl (last N iters)

# ── mGP lambda (density weight) schedule ──────────────────────────────────
lambda_den_schedule         = "hpwl"  # "hpwl" (feedback) or "geometric" (fixed ramp)

# hpwl mode
lambda_den_init             = 8e-5
lambda_den_pcof_upper       = 1.05   # multiplier when overflow is NOT improving (ramp hard)
lambda_den_pcof_lower       = 1.01   # multiplier when overflow IS actively decreasing (gentle ramp)

# geometric mode
lambda_den_weight_init      = 1e-5
lambda_den_max_step         = 1.05

# shared
warmup_iters                = 0
lambda_den_iters_per_update = 1      # update lambda every N iters (1 = every iter)
gamma_iters_per_update      = 1      # update gamma every N iters (1 = every iter)
lambda_den_max              = 50000
target_density          = 0.70

# ── mGP hard-macro density boost ──────────────────────────────────────────
lambda_hm_init  = 1.0    # initial hard-macro density boost (1.0 = disabled); decays toward 1.0 each iter
lambda_hm_decay = 0.995  # per-iter decay toward 1.0

# ── mGP macro halos ───────────────────────────────────────────────────────
halo_size     = 0.2   # inflate hard macro footprints in density map by this fraction (0 = disabled); e.g. 0.1 → (1.1w)×(1.1h), charge conserved via area_ratio
halo_legalize = 0.1
mGP_hard_macro_density_weight = 1.2  # charge weight for hard macros in mGP density map (>1 = stronger repulsion)
mGP_soft_macro_density_weight = 0.8  # charge weight for soft macros in mGP density map (<1 = weaker repulsion)
hard_macro_boundary_margin = 0.0  # keep hard macro edges this far from canvas boundary (fraction of canvas dim)

# ── Phase 2.5: Hard-macro spread ──────────────────────────────────────────
# After mGP convergence, remove soft macros and re-run so hard macros spread into whitespace.
# Only supported with density_method = "electrostatic".
hard_spread       = false  # enable phase 2.5
hard_spread_iters = 50     # number of SGD iterations

# ── Phase 3: mLG — Macro Legalization ─────────────────────────────────────
legalization = "bump"  # "none", "bump" (pairwise push-apart), "spiral" (push-out from center), or "sa"

# SA macro legalization params (only used when legalization = "sa")
# mu_O (WL/overlap penalty) and temperature window both scale by sa_mlg_beta each outer iter.
# Inner steps k_max = sa_mlg_steps_per_macro × num_movable_hard_macros.
sa_mlg_outer_iters     = 10   # max outer SA iterations (stops early on 0 overlaps)
sa_mlg_steps_per_macro = 50   # inner SA steps per outer iter, multiplied by num_movable_hard_macros
sa_mlg_beta            = 1.5  # scale factor per outer iter: raises penalty, temperature, and radius

# ── Phase 3.5: Rotation Optimizer ─────────────────────────────────────────
rotation_optimizer   = "none"   # "none", "greedy", "anneal", or "periodic"
rotation_passes      = 1          # greedy/periodic: full passes over all macros per call
rotation_period      = 10         # periodic: mGP iters between rotation calls
sa_T_init            = 1e-4       # SA initial temperature (WL units)
sa_T_final           = 1e-7       # SA final temperature
sa_steps_per_macro   = 200        # SA total steps = this × num_hard_macros
rotation_candidates  = "no-swap"  # "NS", "no-swap" (mirrors only), or "all" (all 8 D4 orientations)
n_placement_passes   = 1          # run full pipeline this many times, locking orientations between passes

# ── Phase 4: cGP — Cell Global Placement ──────────────────────────────────
# Lock hard macros; re-run WL + density descent for soft macros only.
cGP_enable                    = false # enable phase 4
cGP_iters                     = 5000   # max iterations (early stopping applies)
cGP_position_reset            = false  # reset soft macros to canvas center before cGP
cGP_hard_macro_density_weight = 1.0  # hard macro charge weight in cGP density map (0 = exclude, 1 = full, intermediate = partial)
cGP_soft_macro_density_weight = 1.0  # soft macro charge weight in cGP density map (<1 = weaker repulsion)

# ── Convergence checks (apply to both mGP and cGP) ────────────────────────
# Disable individually to isolate their effect (all default true).
conv_lgamma      = true # stop when overflow < stop_overflow AND wl rising
conv_max_density = true   # stop when max bin density < target_density
conv_plateau     = true   # stop when moving-avg total loss is flat
conv_lambda_max  = true   # stop when lambda is pegged at ceiling AND overflow flat
conv_divergence  = true   # stop when wl > 5×best AND overflow trending up
convergence_countdown = 30  # extra iters to run after convergence before stopping

[ga]
ga_enable  = false   # set true to run genetic algorithm over hyperparameters
pop_size   = 16      # individuals per generation
n_gens     = 5       # number of generations
elite_k    = 2       # top-k individuals carried unchanged to next generation
tourn_k    = 3       # tournament selection size
mut_rate   = 0.25    # per-gene mutation probability
seed       = 0       # RNG seed for GA (independent of placer seed)
time_limit_mins = 55 # total budget; GA stops with len(final_seeds)*avg_run reserved for the seed sweep
final_seeds = [1, 2, 3, 42, 67, 69, 420, 6969]  # after GA, replay best_genes with each seed; [] = disabled

[congestion]
cong_rudy_enable    = true   # compute RUDY congestion map after placement (diagnostic only for now)
cong_rudy_grid_size = 64     # grid resolution (square); independent of density_grid_size
lambda_cong_target         = 0.32   # calibration scale: target = lambda_cong_target × wl_grad_max / cong_grad_max (0 = disabled)
lambda_cong_init           = 0.01   # starting fraction of calibrated target: lambda_cong_eff = target * lambda_cong_init
lambda_cong_ramp           = 1.05   # per-iter multiplier ramping lambda_cong_eff from init → target
cong_start_overflow        = 0.4   # overflow threshold below which congestion gradient activates (Xplace default)

[output]
log_every     = 50
record_frames = true
frames_dir    = "vis/frames"
quiet         = false
highlight_macros        = []  # specific macro names to highlight in GIF; takes priority over highlight_random_macros
highlight_random_macros = 5   # randomly highlight N macros by area (used only when highlight_macros is empty)
highlight_scatter_macros = 0  # highlight the top N scattered macros (by area) from scatter_ids.pt; used when highlight_macros is empty
highlight_io_nets       = 0   # highlight nets connecting to fixed I/O ports (0 = all IO nets, null/omit = disabled)
show_congestion_heatmap = true  # draw RUDY congestion heatmap as background (red = high demand)
congestion_gif          = true  # also export a congestion-only heatmap GIF
show_io_nets            = true # draw nets that connect to an I/O pad
show_other_nets         = false # draw nets NOT connected to I/O pads
show_hard_macros        = true # draw hard macros (steelblue)
show_soft_macros        = true  # draw soft macros (mediumseagreen)
legalization_details    = false  # print per-pass legalization progress lines (can be verbose)
phase_banners           = true   # print a brief banner at the start and end of each placement phase

