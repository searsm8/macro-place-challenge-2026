# CometPlacer configuration
# Loaded automatically from the same directory as placer.py.
# Any key omitted here falls back to the hardcoded default in placer.py.

[params]
initial_placement = "quadratic" # "none", "center", or "quadratic"
initial_spread    = 0.01        # fraction of canvas area used for initial random spread (center mode only)
quad_b2b_iters           = 3   # B2B refinement passes after CLIQUE warm-start (0 = CLIQUE only)
quad_net_size_threshold  = 50  # nets larger than this use star model instead of CLIQUE

# ── Gradient descent ──────────────────────────────────────────────────────
max_iters     = 8000  # upper bound; early stopping will usually fire before this
seed          = 42

# Smoothness of the WA HPWL approximation.
# "auto" -> canvas_diag / 8.0 at runtime. Set a float to override.
gamma         = "auto"
gamma_decay   = 0.98    # multiply gamma by this each iteration
gamma_min_frac = 0.00667 # gamma_min = canvas_diag * gamma_min_frac

# Maximum distance any macro can move in one iteration.
# "auto" -> canvas_diag * 0.005. Set a float to override.
max_step      = "auto"

# ── Convergence ───────────────────────────────────────────────────────────
stop_overflow      = 0.1    # Lgamma: stop when overflow_ratio < this AND wl rising
plateau_window     = 10     # Lsub: moving-average window for loss plateau detection
plateau_threshold  = 0.001  # Lsub: stop when improvement < this fraction per window
divergence_window  = 50     # stop if overflow rising AND wl > 5× best wl (last N iters)

# ── Method selection ──────────────────────────────────────────────────────
density_method        = "electrostatic"   # "bell" or "electrostatic"
legalization          = "bump"            # "none", "bump", or "spiral"
use_preconditioner    = true              # divide gradient by (macro_area + net_degree)
optimizer             = "bb_sgd"          # "sgd", "bb_sgd", or "nesterov"
alpha_init            = "auto"            # initial step size for bb_sgd/nesterov

# ── Lambda (density weight) schedule ──────────────────────────────────────
lambda_schedule         = "hpwl"  # "hpwl" (feedback) or "geometric" (fixed ramp)

# hpwl mode
density_weight          = 8e-3
lambda_pcof_upper       = 1.05   # multiplier when overflow is NOT improving (ramp hard)
lambda_pcof_lower       = 1.01   # multiplier when overflow IS actively decreasing (gentle ramp)

# geometric mode
density_weight_init     = 1e-5
density_weight_max_step = 1.05

# shared
warmup_iters            = 20
density_weight_max      = 5000
target_density          = 0.5

# ── Hard-macro density boost ──────────────────────────────────────────────
# Extra multiplier on density gradient for hard macros only.
# Starts at lambda_hm_init, decays by lambda_hm_decay each iter toward 1.0.
lambda_hm_init          = 1.0    # initial hard-macro density boost
lambda_hm_decay         = 0.995  # per-iter decay (reaches ~1.0 after ~220 iters)

# ── Macro halos ───────────────────────────────────────────────────────────
# Inflate hard macro footprints in the density map by this fraction.
# halo_size = 0.1 -> each hard macro occupies (1.1w) × (1.1h) in the density
# field, reserving whitespace so the legalizer makes smaller corrections.
# Charge is conserved via area_ratio scaling (see density.py). 0 = disabled.
halo_size         = 0.4
halo_legalize     = 0.1

# ── Phase 2.5: Hard-macro spread before legalization ──────────────────────
# After convergence, remove soft macros from the density map and run a short
# continuation. Hard macros spread freely; all macros still feel the field.
# Only supported with density_method = "electrostatic".
hard_spread       = false  # enable phase 2.5
hard_spread_iters = 50     # number of SGD iterations for phase 2.5

# ── Phase 4: Std-cell global placement (cGP) ──────────────────────────────
# After hard-macro legalization, lock hard macros and re-run WL + density
# gradient descent for soft macros only, filling whitespace left by mLG.
soft_place              = false # enable phase 4
soft_place_iters        = 1000   # max iterations for cGP phase (early stopping applies)

[output]
log_every     = 50
record_frames = true
frames_dir    = "vis/frames"
quiet         = false
# Specific macros to highlight by name in the GIF renderer.
# Takes priority over highlight_random_macros. Example:
#   highlight_macros = ["a12324", "a3044"]
highlight_macros = []
# Randomly highlight N macros weighted by area. Used only when highlight_macros is empty.
highlight_random_macros = 3

# ── Genetic Algorithm (orientation search) ────────────────────────────────────
# Set enabled = true to activate. The GA runs before the full gradient descent,
# finding the best hard-macro orientation assignment via curtailed placements.
[ga]
enabled              = false    # flip to true to activate
population_size      = 16
n_generations        = 50
elite_frac           = 0.25     # top fraction preserved unchanged each generation
mutation_rate        = 0.05     # per-gene probability of random orientation flip
tournament_k         = 3        # tournament selection pool size
curtailed_iters      = 300      # max_iters for fast GA evaluation runs (no legalization)
fitness_wl_weight    = 1.0      # WL contribution to fitness
fitness_overflow_weight = 0.5   # overflow ratio contribution to fitness
n_workers            = 1        # >1 enables multiprocessing (not yet implemented)
seed                 = 0        # RNG seed for reproducible GA runs
